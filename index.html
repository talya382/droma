<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>
        <fieldset>
            <legend>Personal Information</legend>
            <label for="name">Name:</label>
            <input placeholder="Enter your name" type="text" id="name" name="name" minlength="2" required>
            <br>
            <label for="pon">pon:</label>
            <input placeholder="Enter your pon" type="tel" id="pon" name="pon">
            </br>
            <br>
            <label for="email">Email:</label>
            <input placeholder="Enter your email" type="email" id="email" name="email" required>
            </br>

        </fieldset>

        <fieldset>
            <legend>Ticket & Workshops</legend>
            <label for="ticket">Ticket type:</label>
            <select id="ticket" name="ticket">
                <option value="1">Student</option>
                <option value="2">VIP</option>
                <option value="3">Standard</option>
            </select>
            <br>

            <label for="checkbox">Workshops :</label>
            <input type="checkbox" id="checkbox" name="option1" value="option1">
            <label for="checkbox">Testing</label>
            <input type="checkbox" id="checkbox" name="option2" value="option2">
            <label for="checkbox"> Accessibility,</label>
            <input type="checkbox" id="checkbox" name="option3" value="option3">
            <label for="checkbox">Web Performance</label>
            </br>

            <br>
            <label for="radio">Diet :</label>
            <input type="radio" id="radio" name="size" value="small">
            <label for="radio">Halal</label>
            <input type="radio" id="radio" name="size" value="large">
            <label for="radio">Kosher</label>
            <input type="radio" id="radio" name="size" value="large">
            <label for="radio">Vegan</label>
            <input type="radio" id="radio" name="size" value="large">
            <label for="radio">None</label>

            <br>
           
        </fieldset>
        <fieldset>
            <legend>Payment Details</legend>
            <label for="card-number">Card number:</label>
            <input type="text" id="card-number" name="card-number" minlength="13" maxlength="19" required>

            <br>
            <label for="cvv">cvv:</label>
            <input type="password" id="cvv" name="cvv" minlength="3" maxlength="4" required>
            <br>
        </fieldset>


        <button type="submit">submit</button>
    </form>
</body>

</html>
